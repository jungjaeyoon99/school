<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학급 공용 돌림판 시스템</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; color: #333; min-height: 100vh; padding: 20px; }

    /* 상단 내비게이션 / 로그인 상태 바 */
    nav { background: white; padding: 14px 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto 20px auto; flex-wrap: wrap; gap: 10px; }
    .nav-brand { font-size: 1.2rem; font-weight: bold; color: #2c3e50; }
    .nav-actions { display: flex; gap: 10px; align-items: center; }
    .nav-btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
    .btn-main { background-color: #4A90E2; color: white; }
    .btn-main:hover { background-color: #357ABD; }
    .btn-secondary { background-color: #f0f2f5; color: #333; }
    .btn-secondary:hover { background-color: #e4e6eb; }
    .user-badge { font-size: 0.9rem; background-color: #eef6ff; color: #4A90E2; padding: 6px 12px; border-radius: 20px; font-weight: 600; }

    /* 컨테이너 */
    .container { max-width: 900px; margin: 0 auto; }

    /* 모달 (로그인 / 불러오기) */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 420px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .modal h2 { margin-bottom: 16px; font-size: 1.3rem; color: #2c3e50; text-align: center; }

    /* 로그인 폼 */
    .login-toggle { display: flex; margin-bottom: 16px; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; }
    .login-toggle button { flex: 1; padding: 10px; border: none; background: #f8f9fa; cursor: pointer; font-weight: bold; color: #666; }
    .login-toggle button.active { background: #4A90E2; color: white; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 6px; }
    .form-group select, .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none; }

    /* 메인 콘텐츠 (돌림판 및 제어판) */
    .app-content { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 768px) {
      .app-content { grid-template-columns: 340px 1fr; }
    }

    /* 돌림판 캔버스 */
    .wheel-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; }
    .wheel-container { position: relative; width: 300px; height: 300px; }
    .pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid #e74c3c; z-index: 10; }
    canvas { width: 300px; height: 300px; border-radius: 50%; }

    .btn-spin { margin-top: 20px; width: 100%; padding: 12px; font-size: 1.1rem; font-weight: bold; color: white; background-color: #2ecc71; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-spin:hover { background-color: #27ae60; }
    .btn-spin:disabled { background-color: #ccc; cursor: not-allowed; }

    /* 제어 패널 */
    .control-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 16px; }
    .mode-selector { display: flex; gap: 8px; }
    .mode-btn { flex: 1; padding: 8px; border: 1px solid #4A90E2; background: white; color: #4A90E2; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .mode-btn.active { background: #4A90E2; color: white; }

    .student-select-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px; max-height: 180px; overflow-y: auto; padding: 8px; border: 1px solid #eee; border-radius: 6px; }
    .student-chip { padding: 6px; border: 1px solid #ddd; border-radius: 4px; text-align: center; font-size: 0.85rem; cursor: pointer; user-select: none; }
    .student-chip.selected { background: #4A90E2; color: white; border-color: #4A90E2; }

    .result-display { background: #eef6ff; padding: 12px; border-radius: 8px; text-align: center; }
    .result-display h4 { font-size: 0.85rem; color: #4A90E2; margin-bottom: 4px; }
    .result-display .winner { font-size: 1.2rem; font-weight: bold; color: #2c3e50; }

    /* 목록 불러오기 리스트 */
    .load-list { list-style: none; max-height: 200px; overflow-y: auto; margin-bottom: 16px; }
    .load-list li { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .load-list li:hover { background-color: #f8f9fa; }
  </style>
</head>
<body>

  <!-- 상단 바 -->
  <nav>
    <div class="nav-brand">🎡 클래스 돌림판</div>
    <div class="nav-actions">
      <button class="nav-btn btn-secondary" onclick="handleMenuClick('create')">돌림판 만들기</button>
      <button class="nav-btn btn-secondary" onclick="handleMenuClick('load')">돌림판 불러오기</button>
      <div id="userInfo" style="display: none;" class="user-badge"></div>
      <button id="authBtn" class="nav-btn btn-main" onclick="openLoginModal()">로그인</button>
    </div>
  </nav>

  <div class="container">
    <!-- 메인 돌림판 영역 -->
    <div class="app-content">
      <!-- 돌림판 시각화 -->
      <div class="wheel-card">
        <div class="wheel-container">
          <div class="pointer"></div>
          <canvas id="wheelCanvas" width="300" height="300"></canvas>
        </div>
        <button id="btnSpin" class="btn-spin" onclick="spinWheel()">돌리기!</button>
      </div>

      <!-- 돌림판 설정 & 모드 선택 -->
      <div class="control-card">
        <div class="result-display">
          <h4>당첨 결과</h4>
          <div id="resultText" class="winner">대기 중...</div>
        </div>

        <div>
          <label style="font-size: 0.9rem; font-weight: bold; display: block; margin-bottom: 8px;">회전 모드 설정</label>
          <div class="mode-selector">
            <button id="modeAllBtn" class="mode-btn active" onclick="setMode('all')">전체 학생 (28명)</button>
            <button id="modeSelectBtn" class="mode-btn" onclick="setMode('select')">선택 학생</button>
          </div>
        </div>

        <!-- 선택 학생 모드 전용 영역 -->
        <div id="studentSelectSection" style="display: none;">
          <label style="font-size: 0.85rem; color: #666; display: block; margin-bottom: 6px;">참여할 학생 번호를 선택하세요</label>
          <div id="studentGrid" class="student-select-grid"></div>
        </div>

        <button class="nav-btn btn-main" style="margin-top: auto;" onclick="saveCurrentWheel()">현재 돌림판 저장하기</button>
      </div>
    </div>
  </div>

  <!-- 1. 로그인 모달 -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal">
      <h2>시스템 로그인</h2>
      <div class="login-toggle">
        <button id="tabTeacher" class="active" onclick="switchLoginTab('teacher')">교사 로그인</button>
        <button id="tabStudent" onclick="switchLoginTab('student')">학생 로그인</button>
      </div>

      <!-- 교사 로그인 폼 -->
      <div id="teacherForm">
        <div class="form-group">
          <label>과목 선택</label>
          <select id="subjectSelect">
            <option value="국어">국어</option>
            <option value="음악">음악</option>
            <option value="진로 탐색">진로 탐색</option>
            <option value="수학">수학</option>
            <option value="영어">영어</option>
            <option value="과학">과학</option>
          </select>
        </div>
      </div>

      <!-- 학생 로그인 폼 -->
      <div id="studentForm" style="display: none;">
        <div class="form-group">
          <label>학생 번호 (1~28번)</label>
          <input type="number" id="studentNumInput" min="1" max="28" placeholder="예: 15">
        </div>
      </div>

      <button class="btn-spin" style="margin-top: 10px;" onclick="submitLogin()">확인</button>
    </div>
  </div>

  <!-- 2. 돌림판 불러오기 모달 -->
  <div id="loadModal" class="modal-overlay">
    <div class="modal">
      <h2>저장된 돌림판 불러오기</h2>
      <ul id="loadList" class="load-list"></ul>
      <button class="nav-btn btn-secondary" style="width: 100%;" onclick="closeModal('loadModal')">닫기</button>
    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // TODO: 본인의 Firebase 프로젝트 설정 정보를 넣으세요.
    const firebaseConfig = {
      apiKey: "AIzaSyDJkRcnDC98-_meOyBAL1Pxnfnqqobu0Sc",
      authDomain: "school-scheduler-site.firebaseapp.com",
      projectId: "school-scheduler-site",
      storageBucket: "school-scheduler-site.firebasestorage.app",
      messagingSenderId: "795313018608",
      appId: "1:795313018608:web:e27b73e0be3fbb9bccd435"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const TOTAL_STUDENTS = 28;
    const COLORS = ["#f39c12", "#e74c3c", "#9b59b6", "#3498db", "#2ecc71", "#1abc9c", "#e67e22", "#34495e"];

    // 앱 상태 variables
    let currentUser = null; // { role: 'teacher'|'student', detail: 과목명 or 번호 }
    let loginTab = 'teacher';
    let currentMode = 'all'; // 'all' or 'select'
    let selectedStudents = new Set(Array.from({length: TOTAL_STUDENTS}, (_, i) => i + 1)); // 기본 전체
    let currentItems = Array.from({length: TOTAL_STUDENTS}, (_, i) => `${i + 1}번`);
    let currentRotation = 0;
    let isSpinning = false;

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const wheelRef = ref(db, "shared_roulette");

    // 1. Firebase 실시간 데이터 구독 (동기화)
    onValue(wheelRef, (snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.val();
        currentItems = data.items || [];
        currentRotation = data.rotation || 0;
        document.getElementById("resultText").innerText = data.lastResult || "대기 중...";
        drawWheel();
      }
    });

    // 2. 인증 & 메뉴 제어
    window.handleMenuClick = (action) => {
      if (!currentUser) {
        openLoginModal();
        return;
      }
      if (action === 'create') {
        alert("현재 화면에서 모드(전체/선택)를 설정한 뒤 '현재 돌림판 저장하기'를 누르면 생성됩니다.");
      } else if (action === 'load') {
        openLoadModal();
      }
    };

    window.openLoginModal = () => document.getElementById("loginModal").classList.add("active");
    window.closeModal = (id) => document.getElementById(id).classList.remove("active");

    window.switchLoginTab = (tab) => {
      loginTab = tab;
      document.getElementById("tabTeacher").classList.toggle("active", tab === 'teacher');
      document.getElementById("tabStudent").classList.toggle("active", tab === 'student');
      document.getElementById("teacherForm").style.display = tab === 'teacher' ? 'block' : 'none';
      document.getElementById("studentForm").style.display = tab === 'student' ? 'block' : 'none';
    };

    window.submitLogin = () => {
      if (loginTab === 'teacher') {
        const subject = document.getElementById("subjectSelect").value;
        currentUser = { role: '교사', detail: subject };
      } else {
        const num = document.getElementById("studentNumInput").value;
        if (!num || num < 1 || num > TOTAL_STUDENTS) {
          alert("1번부터 28번 사이의 번호를 입력해주세요.");
          return;
        }
        currentUser = { role: '학생', detail: `${num}번` };
      }

      // UI 반영
      document.getElementById("userInfo").innerText = `[${currentUser.role}] ${currentUser.detail}`;
      document.getElementById("userInfo").style.display = "inline-block";
      document.getElementById("authBtn").innerText = "로그아웃";
      document.getElementById("authBtn").onclick = logout;

      closeModal("loginModal");
    };

    function logout() {
      currentUser = null;
      document.getElementById("userInfo").style.display = "none";
      document.getElementById("authBtn").innerText = "로그인";
      document.getElementById("authBtn").onclick = openLoginModal;
    }

    // 3. 학생 선택 및 모드 변경
    window.setMode = (mode) => {
      currentMode = mode;
      document.getElementById("modeAllBtn").classList.toggle("active", mode === 'all');
      document.getElementById("modeSelectBtn").classList.toggle("active", mode === 'select');
      document.getElementById("studentSelectSection").style.display = mode === 'select' ? 'block' : 'none';

      if (mode === 'all') {
        selectedStudents = new Set(Array.from({length: TOTAL_STUDENTS}, (_, i) => i + 1));
      }
      updateItemsFromSelection();
    };

    function renderStudentGrid() {
      const grid = document.getElementById("studentGrid");
      grid.innerHTML = "";
      for (let i = 1; i <= TOTAL_STUDENTS; i++) {
        const chip = document.createElement("div");
        chip.className = `student-chip ${selectedStudents.has(i) ? 'selected' : ''}`;
        chip.innerText = `${i}번`;
        chip.onclick = () => {
          if (selectedStudents.has(i)) {
            if (selectedStudents.size <= 2) {
              alert("최소 2명 이상 선택해야 합니다.");
              return;
            }
            selectedStudents.delete(i);
          } else {
            selectedStudents.add(i);
          }
          chip.classList.toggle("selected");
          updateItemsFromSelection();
        };
        grid.appendChild(chip);
      }
    }

    function updateItemsFromSelection() {
      const sorted = Array.from(selectedStudents).sort((a, b) => a - b);
      currentItems = sorted.map(num => `${num}번`);
      drawWheel();
      saveStateToFirebase();
    }

    // 4. 돌림판 그리기
    function drawWheel() {
      const numItems = currentItems.length;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 5;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numItems === 0) return;

      const arcSize = (Math.PI * 2) / numItems;

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate((currentRotation * Math.PI) / 180);

      for (let i = 0; i < numItems; i++) {
        const angle = i * arcSize;
        ctx.fillStyle = COLORS[i % COLORS.length];

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, angle, angle + arcSize);
        ctx.lineTo(0, 0);
        ctx.fill();

        ctx.save();
        ctx.rotate(angle + arcSize / 2);
        ctx.fillStyle = "white";
        ctx.font = "bold 13px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(currentItems[i], radius - 15, 4);
        ctx.restore();
      }

      ctx.restore();
    }

    // 5. 회전 실행
    window.spinWheel = () => {
      if (!currentUser) {
        openLoginModal();
        return;
      }
      if (isSpinning || currentItems.length === 0) return;

      isSpinning = true;
      document.getElementById("btnSpin").disabled = true;

      const additionalRotation = 360 * 5 + Math.floor(Math.random() * 360);
      const targetRotation = currentRotation + additionalRotation;
      const duration = 4000;
      const startRotation = currentRotation;
      const startTime = performance.now();

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        
        currentRotation = startRotation + additionalRotation * easeOut;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          document.getElementById("btnSpin").disabled = false;
          currentRotation = targetRotation % 360;

          const numItems = currentItems.length;
          const degreesPerItem = 360 / numItems;
          const normalizedRotation = (360 - (currentRotation % 360) + 270) % 360;
          const winningIndex = Math.floor(normalizedRotation / degreesPerItem) % numItems;

          const winner = currentItems[winningIndex];
          document.getElementById("resultText").innerText = `🎉 ${winner}`;

          saveStateToFirebase(winner);
        }
      }

      requestAnimationFrame(animate);
    };

    // Firebase 연동 함수
    function saveStateToFirebase(lastResult = null) {
      const payload = {
        items: currentItems,
        rotation: currentRotation
      };
      if (lastResult !== null) payload.lastResult = lastResult;
      update(wheelRef, payload);
    }

    window.saveCurrentWheel = () => {
      if (!currentUser) { openLoginModal(); return; }
      const name = prompt("저장할 돌림판 이름을 입력하세요:", `${currentUser.detail} 돌림판`);
      if (!name) return;

      const presetsRef = ref(db, `wheel_presets/${name}`);
      set(presetsRef, {
        items: currentItems,
        createdAt: new Date().toISOString(),
        createdBy: `${currentUser.role} (${currentUser.detail})`
      });
      alert("성공적으로 저장되었습니다!");
    };

    window.openLoadModal = () => {
      const presetsRef = ref(db, "wheel_presets");
      get(presetsRef).then((snapshot) => {
        const listEl = document.getElementById("loadList");
        listEl.innerHTML = "";
        if (snapshot.exists()) {
          const data = snapshot.val();
          Object.keys(data).forEach((key) => {
            const li = document.createElement("li");
            li.innerHTML = `<strong>${key}</strong> <span style="font-size: 0.8rem; color: #888;">${data[key].createdBy}</span>`;
            li.onclick = () => {
              currentItems = data[key].items;
              drawWheel();
              saveStateToFirebase();
              closeModal("loadModal");
            };
            listEl.appendChild(li);
          });
        } else {
          listEl.innerHTML = "<li>저장된 돌림판이 없습니다.</li>";
        }
        document.getElementById("loadModal").classList.add("active");
      });
    };

    // 초기화
    renderStudentGrid();
    drawWheel();
  </script>
</body>
</html>
